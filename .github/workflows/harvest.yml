name: harvest

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub may delay scheduled runs by 5–15 min under load
  workflow_dispatch: {}

permissions:
  contents: write              # only for the keepalive commit below

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Harvest DTEK → svitlo.stream
        env:
          SERVER_URL: https://svitlo.stream
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GROUP: "3.1"
          PREFER_BROWSER: "1"
        run: python dtek_harvester.py --force

      # GitHub disables scheduled workflows in public repos after 60 days without commits.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now - last)) -gt $((50 * 86400)) ]; then
            git config user.name "svitlo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
